apis:
- aid: agentum-lat:business-a2a-agent
  name: AGENTUM Business A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface of AGENTUM Business: an agent card at https://business.agentum.lat/.well-known/agent-card.json
    (A2A 1.0 shape — supportedInterfaces with protocolBinding JSONRPC and protocolVersion "1.0", version
    0.1.0, provider AGENTUM) advertising two skills: company_intelligence (structured CNPJ intelligence
    from brasilapi.com.br with a receitaws.com.br fallback) and repo_intelligence (question answering
    over a public GitHub repository through the external DeepWiki MCP server, stated as free "in this
    lab round"). The JSON-RPC endpoint is the host root, https://business.agentum.lat/; it enforces the
    protocol version (an unversioned request is refused with JSON-RPC error -32009 "Supported versions:
    1.0"). Streaming is declared supported, push notifications and an extended card are not, and securitySchemes
    is empty.
  humanURL: https://business.agentum.lat/.well-known/agent-card.json
  baseURL: https://business.agentum.lat/
