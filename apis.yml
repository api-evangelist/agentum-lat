aid: agentum-lat
name: AGENTUM
description: >-
  AGENTUM (AGENTUM LTDA, a software company in Sertãozinho, São Paulo, Brazil, registered September 2026) is a
  "payment agent" data provider: eleven HTTP endpoints sold per call over the x402 protocol — USDC on Base
  mainnet (eip155:8453) — with no account, no API key and no subscription; an agent pays inside the request and
  receives the result in the same round trip. Nine routes on agentum.lat cover Brazilian and global company and
  market data (CNPJ registration status, CEP address lookup, CPF check-digit validation, Banco Central
  Selic/CDI/commercial-dollar rates, ECB FX rates, World Bank indicators, EU VIES VAT validation, GLEIF LEI
  lookup and an AI-summarised business-intelligence report on a CNPJ), and three on business.agentum.lat
  (AGENTUM Business) add counterparty compliance checks against TCU, CEIS/CNEP, CNJ and CVM plus a consolidated
  preflight verdict. The same routes ship as eleven tools in the @agentum/mcp-server npm package (stdio, the
  caller's own wallet pays), and AGENTUM Business is also an A2A 1.0 JSON-RPC agent with a card at
  business.agentum.lat/.well-known/agent-card.json. Partial OpenAPI 3.1 contracts, an llms.txt and an RFC 9116
  security.txt are published; every paid route answers a genuine x402 v2 challenge with Bazaar discovery
  metadata and IETF RateLimit headers.
