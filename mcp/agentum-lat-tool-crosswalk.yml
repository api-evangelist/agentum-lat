  contract — eleven tools with zod input schemas — while the two OpenAPI documents together describe only
  seven operations, because the agentum.lat contract is partial by the provider's own statement. Six tools
  bind one-to-one to a declared operationId (the tool's route is literally that path). Five tools call routes
  that are live (each answered an x402 402 on 2026-09-19) but absent from the published OpenAPI, so their only
  machine-readable input contract is the tool schema and the Bazaar schema inside the 402 challenge. One REST
  operation (company) has no tool. The A2A company_intelligence skill overlaps the business host's registration
  routes; repo_intelligence has no REST twin at all.
