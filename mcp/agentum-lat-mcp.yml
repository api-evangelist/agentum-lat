  sdk: '@modelcontextprotocol/sdk ^1.30.0 — McpServer + StdioServerTransport'
  license: MIT
  description: (Portuguese) AGENTUM's MCP server — exposes the eleven paid HTTP routes (nine on agentum.lat, two on business.agentum.lat) as MCP tools so any MCP-capable
    agent host can call them and pay per call in USDC over x402 without knowing the protocol or writing payment code. The installer supplies THEIR OWN wallet (AGENTUM_MCP_WALLET_KEY);
    every tool call is a real on-chain payment on Base mainnet.
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @agentum/mcp-server
  package: https://www.npmjs.com/package/@agentum/mcp-server
  auth: none
  payment: x402 v2 — the caller's own Base wallet private key (env AGENTUM_MCP_WALLET_KEY, required, secret) signs a USDC payment per tool call; there is no provider-issued
    credential
  verified: searched
  checked: '2026-09-19'
  note: 'No remote endpoint exists: mcp.agentum.lat does not resolve and /mcp returns 404 on both hosts, so an agent cannot reach these tools without a human installing
    the package on a machine first. tools/list was not executed (running the package requires a funded wallet key); the tool set below is read verbatim from the published
    source, which is the same code npm distributes.'
authorship: provider (first-party — manifest.json author AGENTUM, agentumcomercial@carmozinog.com, https://agentum.lat)
client_configuration:
  claude_desktop: '{"mcpServers":{"agentum":{"command":"npx","args":["-y","@agentum/mcp-server"],"env":{"AGENTUM_MCP_WALLET_KEY":"<your wallet private key>"}}}}'
  claude_code: claude mcp add agentum -e AGENTUM_MCP_WALLET_KEY=$AGENTUM_MCP_WALLET_KEY -- npx -y @agentum/mcp-server
  cursor: same JSON as Claude Desktop in ~/.cursor/mcp.json
  wallet_requirement: a dedicated Ethereum wallet holding USDC on Base mainnet (eip155:8453); the README says the facilitator sponsors gas so no ETH is needed, and
