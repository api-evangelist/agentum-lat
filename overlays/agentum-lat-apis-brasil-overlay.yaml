x-method: generated
x-source: >-
  Generated from openapi/agentum-lat-apis-brasil-openapi.json plus what was observed on the live host on
  2026-09-19 (402 challenges, rate-limit headers, a 429, and a 402 — not a 400 — on a malformed CNPJ, because the payment gate precedes validation) and the provider's own
  llms.txt. Every value below was observed or read from the provider's documents; nothing is proposed that the
