summary: >-
  Both contracts declare a 402 on every operation; the Business contract also declares 400 (invalid query /
  CNPJ), 404 (preflight: no company for that LEI/name) and 502 (sources unavailable), with descriptions but no
  response schema. Every entry below marked observed was returned live on 2026-09-19 without any payment being
  made. Two envelopes are in use and neither is RFC 9457: agentum.lat answers its 402 with an EMPTY JSON object
  ({}) and puts the whole PaymentRequirements document in the PAYMENT-REQUIRED header; business.agentum.lat
  answers with {"error":"<CODE>","message":"<text>"} plus the same header. Unknown paths on both hosts return
  Express's HTML "Cannot GET <path>". The payment gate answers FIRST on both hosts: a malformed CNPJ (cnpj=123) on either host and an empty or one-character preflight q both returned 402, so the contract's 400 sits behind the gate, was not observed, and a malformed query is challenged exactly like a valid one.
envelope:
  business_agentum_lat: '{"error": string (SCREAMING_SNAKE code), "message": string}'
  agentum_lat: '{} on 402; {"error": string (Portuguese sentence)} on 429'
  unknown_route: Express HTML "Cannot GET <path>" (text/html), both hosts
problems:
- status: 402
  code: PAYMENT_REQUIRED
  title: Payment required (x402 v2)
  media_type: application/json; charset=utf-8
  headers:
  - 'PAYMENT-REQUIRED: <base64 JSON PaymentRequirements — x402Version 2, resource {url, description, mimeType}, accepts[{scheme exact, network eip155:8453, amount (atomic USDC), asset, payTo, maxTimeoutSeconds 300, extra {name "USD Coin", version "2"}}], extensions.bazaar {info, schema}>'
  - 'RateLimit-Policy / RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset'
  body_agentum_lat: '{}'
  body_business: '{"error":"PAYMENT_REQUIRED","message":"Payment required"}'
  when: Any request to a paid route without a valid x402 payment. Observed on GET /taxas-brasil, /verificar-cnpj, /verificar-cep, /validar-cpf, /fx-rates, /economic-data, /vat-validate, /company-enrich, POST /business-intelligence (agentum.lat) and GET /company, /company-intelligence, /preflight (business.agentum.lat).
  remediation: Decode PAYMENT-REQUIRED, settle accepts[0] (exact scheme, USDC on Base) within maxTimeoutSeconds and retry with the x402 payment header; the provider's @agentum/mcp-server does this with @x402/fetch. Each 402 counts against the rate limit.
  declared_in_contract: true
  observed: true
  source_operations:
