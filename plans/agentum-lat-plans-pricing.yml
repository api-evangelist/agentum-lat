summary: >-
  AGENTUM publishes no subscription, tier, free quota or enterprise plan: the only commercial model is a fixed
  USD price per call, paid in USDC on Base mainnet (eip155:8453) through the x402 protocol (v2, "exact"
  scheme) inside the request itself. There is no sign-up, no API key and no invoice — the price is quoted in
  the 402 challenge and settled on-chain before the response is released. Twelve routes across two hosts,
  priced from $0.01 to $0.15 per call. Every published price was confirmed against the live challenge
  (USDC has six decimals, so 10000 atomic units = $0.01). The repo_intelligence A2A skill is stated free "in
  this lab round" and is the only unpriced surface.
