agent_card:
  name: AGENTUM Business
  description: >-
    (Portuguese) AGENTUM's commercial/orchestrator agent: receives a job and delivers the finished result via
    the Agent2Agent (A2A) protocol. Not a new AI model — an execution layer over real skills.
  provider:
    organization: AGENTUM
    url: https://agentum.lat
  version: 0.1.0
  supported_interfaces:
  - {url: 'https://business.agentum.lat/', protocolBinding: JSONRPC, protocolVersion: '1.0', tenant: ''}
  capabilities: {streaming: true, pushNotifications: false, extensions: [], extendedAgentCard: false}
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json]
  skills: 2
  skill_list:
  - id: company_intelligence
    name: Company Intelligence
    tags: [brasil, cnpj, business-intelligence, kyb]
    input: >-
      a Brazilian CNPJ (14 digits, with or without mask) as JSON {"cnpj": ...} or plain text
    output: structured company intelligence — legal name, registration status, legal nature, main CNAE, address, Simples Nacional flag — aggregated from brasilapi.com.br with a receitaws.com.br fallback
    http_twin: GET https://business.agentum.lat/company?cnpj= (registration only) / GET /company-intelligence?cnpj= (with integrity findings) — see mcp/agentum-lat-tool-crosswalk.yml
  - id: repo_intelligence
    name: Repo Intelligence
    tags: [mcp, github, documentation, technical-intelligence]
    input: '{"repoName": "owner/repo", "question": "..."}'
    output: a contextualised answer about that public GitHub repository's documentation/code, obtained through the external DeepWiki MCP server (mcp.deepwiki.com)
    note: 'Card text: "Grátis nesta rodada de laboratório (sem cobrança x402 ainda)". No HTTP or OpenAPI twin; delegates to a third-party MCP server.'
